
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Gestion des tâches</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080d19;
      color: #f3f6ff;
      min-height: 100vh;
      padding: 30px 16px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #75e4c3;
    }

    .subtitle {
      color: #aab6cd;
      margin-top: 7px;
      font-size: 14px;
    }

    .date {
      color: #75e4c3;
      font-size: 13px;
      text-align: right;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat, .panel {
      background: #111a2c;
      border: 1px solid #293751;
      border-radius: 16px;
      padding: 22px;
    }

    .stat p {
      color: #aab6cd;
      font-size: 14px;
    }

    .stat h2 {
      font-size: 30px;
      margin-top: 10px;
    }

    .accent {
      color: #75e4c3;
    }

    .panel {
      margin-bottom: 22px;
    }

    h2.section-title {
      font-size: 19px;
      margin-bottom: 18px;
    }

    .task-form {
      display: grid;
      grid-template-columns: 1fr 170px auto;
      gap: 10px;
    }

    input, select, button {
      font: inherit;
      border-radius: 9px;
      padding: 12px;
    }

    input, select {
      background: #0b1323;
      border: 1px solid #35435e;
      color: #f3f6ff;
      min-width: 0;
    }

    input:focus, select:focus {
      outline: 2px solid #75e4c3;
      outline-offset: 1px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn {
      background: #75e4c3;
      color: #08131b;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #1a263c;
      color: #c4cde0;
      border: 1px solid #35435e;
      padding: 9px 12px;
      font-size: 13px;
    }

    .filter-btn.active {
      background: #75e4c3;
      color: #08131b;
      border-color: #75e4c3;
    }

    .search {
      flex: 1;
      max-width: 250px;
    }

    .task-list {
      display: grid;
      gap: 12px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 16px;
      border: 1px solid #293751;
      background: #0d1628;
      border-radius: 12px;
    }

    .task-check {
      width: 19px;
      height: 19px;
      accent-color: #75e4c3;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-info h3 {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .task-info p {
      color: #aab6cd;
      font-size: 12px;
      margin-top: 7px;
    }

    .completed h3 {
      text-decoration: line-through;
      color: #8995aa;
    }

    .priority {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .high {
      background: #4a2432;
      color: #ff9bb0;
    }

    .medium {
      background: #44371e;
      color: #ffd580;
    }

    .low {
      background: #173c35;
      color: #75e4c3;
    }

    .delete-btn {
      background: #38202b;
      color: #ff9bb0;
      padding: 8px 10px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #aab6cd;
      padding: 35px 10px;
    }

    .progress-track {
      background: #293751;
      height: 8px;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 13px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #75e4c3;
      transition: width .25s;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: #aab6cd;
      font-size: 13px;
      gap: 10px;
    }

    footer {
      text-align: center;
      color: #7f8ba2;
      font-size: 12px;
      padding: 15px;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .stat {
        padding: 16px;
      }

      .stat h2 {
        font-size: 25px;
      }

      .task-form {
        grid-template-columns: 1fr;
      }

      .search {
        max-width: none;
        width: 100%;
      }

      header {
        align-items: flex-start;
      }

      .task {
        flex-wrap: wrap;
      }

      .priority {
        margin-left: 30px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div>
        <div class="logo">Task<span>Flow</span></div>
        <p class="subtitle">Organisez vos tâches, avancez chaque jour.</p>
      </div>
      <div class="date" id="today"></div>
    </header>

    <section class="stats">
      <article class="stat">
        <p>Total des tâches</p>
        <h2 id="total">0</h2>
      </article>
      <article class="stat">
        <p>À faire</p>
        <h2 id="pending" class="accent">0</h2>
      </article>
      <article class="stat">
        <p>Terminées</p>
        <h2 id="done">0</h2>
      </article>
    </section>

    <section class="panel">
      <h2 class="section-title">Ajouter une tâche</h2>

      <form id="taskForm" class="task-form">
        <input
          type="text"
          id="taskTitle"
          placeholder="Ex : Réviser JavaScript..."
          maxlength="100"
          required
        >

        <select id="taskPriority" aria-label="Priorité">
          <option value="low">Priorité basse</option>
          <option value="medium" selected>Priorité moyenne</option>
          <option value="high">Priorité haute</option>
        </select>

        <button class="add-btn" type="submit">+ Ajouter</button>
      </form>
    </section>

    <section class="panel">
      <div class="progress-label">
        <span>Progression globale</span>
        <span id="progressText">0%</span>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="Progression des tâches"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="progressTrack"
      >
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>

    <section class="panel">
      <h2 class="section-title">Mes tâches</h2>

      <div class="toolbar">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">Toutes</button>
          <button class="filter-btn" data-filter="pending">À faire</button>
          <button class="filter-btn" data-filter="done">Terminées</button>
        </div>

        <input
          type="search"
          class="search"
          id="searchInput"
          placeholder="Rechercher..."
          aria-label="Rechercher une tâche"
        >
      </div>

      <div id="taskList" class="task-list"></div>
    </section>

    <footer>
      TaskFlow · Projet personnel d'Anas Radouani · HTML, CSS, JavaScript
    </footer>

  </main>

  <script>
    // 1. Récupérer les éléments HTML
    const taskForm = document.getElementById("taskForm");
    const taskTitle = document.getElementById("taskTitle");
    const taskPriority = document.getElementById("taskPriority");
    const taskList = document.getElementById("taskList");
    const searchInput = document.getElementById("searchInput");

    // 2. Charger les tâches sauvegardées
    let tasks = [];

    try {
      const savedTasks = JSON.parse(
        localStorage.getItem("taskflow-tasks")
      );

      if (Array.isArray(savedTasks)) {
        tasks = savedTasks.filter(task =>
          task &&
          typeof task.id === "string" &&
          typeof task.title === "string" &&
          typeof task.completed === "boolean" &&
          ["low", "medium", "high"].includes(task.priority)
        );
      }
    } catch (error) {
      tasks = [];
    }

    let currentFilter = "all";

    // 3. Afficher la date
    document.getElementById("today").textContent =
      new Date().toLocaleDateString("fr-FR", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });

    // 4. Sauvegarder les tâches dans le navigateur
    function saveTasks() {
      localStorage.setItem("taskflow-tasks", JSON.stringify(tasks));
    }

    // 5. Ajouter une tâche
    taskForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const title = taskTitle.value.trim();

      if (title === "") {
        return;
      }

      const newTask = {
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        title: title,
        priority: taskPriority.value,
        completed: false
      };

      tasks.unshift(newTask);

      saveTasks();
      taskForm.reset();
      taskTitle.focus();

      renderTasks();
    });

    // 6. Changer l'état d'une tâche ou la supprimer
    taskList.addEventListener("change", function(event) {
      if (!event.target.matches(".task-check")) {
        return;
      }

      const task = tasks.find(item => item.id === event.target.dataset.id);

      if (task) {
        task.completed = event.target.checked;
        saveTasks();
        renderTasks();
      }
    });

    taskList.addEventListener("click", function(event) {
      const button = event.target.closest(".delete-btn");

      if (!button) {
        return;
      }

      const id = button.dataset.id;
      tasks = tasks.filter(task => task.id !== id);

      saveTasks();
      renderTasks();
    });

    // 7. Changer le filtre
    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", function() {
        currentFilter = this.dataset.filter;

        document.querySelectorAll(".filter-btn").forEach(btn => {
          btn.classList.toggle("active", btn === this);
        });

        renderTasks();
      });
    });

    // 8. Rechercher une tâche
    searchInput.addEventListener("input", renderTasks);

    // 9. Afficher les tâches et actualiser les statistiques
    function renderTasks() {
      const search = searchInput.value.trim().toLowerCase();

      const filteredTasks = tasks.filter(task => {
        const matchesSearch = task.title.toLowerCase().includes(search);

        const matchesFilter =
          currentFilter === "all" ||
          (currentFilter === "pending" && !task.completed) ||
          (currentFilter === "done" && task.completed);

        return matchesSearch && matchesFilter;
      });

      taskList.replaceChildren();

      if (filteredTasks.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "empty";
        emptyMessage.textContent = tasks.length === 0
          ? "Aucune tâche pour le moment. Ajoutez votre première tâche !"
          : "Aucune tâche ne correspond à votre recherche.";
        taskList.appendChild(emptyMessage);
      }

      filteredTasks.forEach(task => {
        const article = document.createElement("article");
        article.className = "task";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = task.completed;
        checkbox.dataset.id = task.id;
        checkbox.setAttribute("aria-label", "Marquer comme terminée");

        const info = document.createElement("div");
        info.className = "task-info" + (task.completed ? " completed" : "");

        const title = document.createElement("h3");
        title.textContent = task.title;

        const description = document.createElement("p");
        description.textContent = task.completed
          ? "Tâche terminée"
          : "Tâche en cours";

        info.append(title, description);

        const priority = document.createElement("span");
        priority.className = "priority " + task.priority;

        const priorityLabels = {
          low: "Basse",
          medium: "Moyenne",
          high: "Haute"
        };

        priority.textContent = priorityLabels[task.priority];

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.dataset.id = task.id;
        deleteButton.textContent = "Supprimer";
        deleteButton.setAttribute("aria-label", "Supprimer " + task.title);

        article.append(checkbox, info, priority, deleteButton);
        taskList.appendChild(article);
      });

      updateStats();
    }

    // 10. Calculer les statistiques
    function updateStats() {
      const total = tasks.length;
      const completed = tasks.filter(task => task.completed).length;
      const pending = total - completed;

      const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      document.getElementById("total").textContent = total;
      document.getElementById("pending").textContent = pending;
      document.getElementById("done").textContent = completed;
      document.getElementById("progressText").textContent = percentage + "%";
      document.getElementById("progressBar").style.width = percentage + "%";
      document.getElementById("progressTrack").setAttribute(
        "aria-valuenow",
        percentage
      );
    }

    // 11. Afficher les tâches au démarrage
    renderTasks();
  </script>
</body>
</html>
